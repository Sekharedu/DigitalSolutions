<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounting Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">

    <!-- Header Navigation -->
    <header class="bg-blue-900 text-white p-4 sticky top-0 shadow-md z-50 flex justify-between items-center">
        <div>
            <h1 id="userTitle" class="text-lg font-bold">Loading...</h1>
            <p id="siteSubtitle" class="text-xs text-blue-200"></p>
        </div>
        <a href="/api/logout" class="bg-red-500 text-xs px-3 py-2 rounded-lg font-semibold">Logout</a>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-6">

        <!-- SUPERVISOR ACTIONS PANEL (Hidden from Admin) -->
        <section id="supervisorPanel" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Add Cash Entry -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="font-bold text-md mb-3 text-slate-700">New Cash Entry</h3>
                <form action="/api/transaction" method="POST" class="space-y-3">
                    <select name="type" class="w-full border p-2 rounded-lg text-sm">
                        <option value="receipt">Receipt (Cash In)</option>
                        <option value="payment">Payment (Cash Out)</option>
                    </select>
                    <input type="number" name="amount" placeholder="Amount ($)" step="0.01" class="w-full border p-2 rounded-lg text-sm" required>
                    <input type="text" name="description" placeholder="Expense description" class="w-full border p-2 rounded-lg text-sm" required>
                    <button type="submit" class="w-full bg-emerald-600 text-white p-2 rounded-lg text-sm font-bold">Save Entry</button>
                </form>
            </div>

            <!-- Upload Document -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="font-bold text-md mb-3 text-slate-700">Upload Receipt / Invoice</h3>
                <form action="/api/upload" method="POST" enctype="multipart/form-data" class="space-y-3">
                    <input type="file" name="document" accept=".pdf, .jpg, .jpeg, .png" class="w-full border p-2 rounded-lg text-sm text-slate-500 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-700 text-xs" required>
                    <p class="text-[10px] text-slate-400">Supported formats: PDF, JPG, PNG</p>
                    <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded-lg text-sm font-bold">Upload File</button>
                </form>
            </div>
        </section>

        <!-- FINANCIAL REPORT TABLE -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="p-4 bg-slate-100 border-b border-slate-200">
                <h3 class="font-bold text-slate-700 text-md">Recent Transactions</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="bg-slate-50 text-slate-500 uppercase text-xs">
                        <tr>
                            <th class="p-3">Site</th>
                            <th class="p-3">Type</th>
                            <th class="p-3">Amount</th>
                            <th class="p-3">Details</th>
                        </tr>
                    </thead>
                    <tbody id="transactionTable" class="divide-y divide-slate-100">
                        <!-- Dynamic content injections -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- SUBMITTED DOCUMENTS SECTION -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
            <h3 class="font-bold text-slate-700 text-md mb-3">Collected Site Documents</h3>
            <div id="documentList" class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm">
                <!-- Dynamic Content Injections -->
            </div>
        </section>

    </main>

    <script>
        async function initDashboard() {
            // Get user dynamic status
            const userRes = await fetch('/api/user');
            const user = await userRes.json();
            
            document.getElementById('userTitle').innerText = `${user.username.toUpperCase()} Dashboard`;
            document.getElementById('siteSubtitle').innerText = `Assigned Scope: ${user.site_name}`;

            if(user.role === 'supervisor') {
                document.getElementById('supervisorPanel').classList.remove('hidden');
            }

            // Get financial records data
            const dataRes = await fetch('/api/data');
            const data = await dataRes.json();

            // Populate Transactions
            const txTable = document.getElementById('transactionTable');
            txTable.innerHTML = data.transactions.map(tx => `
                <tr class="hover:bg-slate-50">
                    <td class="p-3 font-semibold text-slate-600">${tx.site_name}</td>
                    <td class="p-3">
                        <span class="px-2 py-0.5 rounded-full text-xs font-bold ${tx.type === 'receipt' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                            ${tx.type.toUpperCase()}
                        </span>
                    </td>
                    <td class="p-3 font-mono font-bold">${tx.amount.toFixed(2)}</td>
                    <td class="p-3 text-xs text-slate-500">${tx.description}</td>
                </tr>
            `).join('');

            // Populate Documents List
            const docList = document.getElementById('documentList');
            if (data.documents.length === 0) {
                docList.innerHTML = `<p class="text-slate-400 text-xs">No documents uploaded yet.</p>`;
            } else {
                docList.innerHTML = data.documents.map(doc => `
                    <div class="flex items-center justify-between p-3 border rounded-xl bg-slate-50">
                        <div class="truncate mr-2">
                            <p class="font-semibold text-xs text-slate-700 truncate">${doc.file_path.split('/').pop()}</p>
                            <p class="text-[10px] text-slate-400">${doc.site_name}</p>
                        </div>
                        <a href="${doc.file_path}" target="_blank" class="bg-blue-100 text-blue-700 text-xs px-2 py-1 rounded font-bold hover:bg-blue-200">View/Download</a>
                    </div>
                `).join('');
            }
        }
        initDashboard();
    </script>
</body>
</html>
